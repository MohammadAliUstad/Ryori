<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="200" height="200" overflow="visible" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#FFFBEB"/>

  <!-- Shadow: shrinks as burger floats up -->
  <ellipse cx="16" cy="30.8" rx="0" ry="0.7" fill="#92400E" opacity="0.15">
    <animate attributeName="rx" values="0;8" dur="0.3s" begin="0.65s" fill="freeze"/>
    <animate attributeName="rx"
      values="8;6;8" dur="1.8s" begin="1.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="opacity"
      values="0.15;0.07;0.15" dur="1.8s" begin="1.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
  </ellipse>

  <!-- ===================== FLOAT WRAPPER (whole burger bobs) ===================== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0;0 -1.5;0 0"
      dur="1.8s" begin="1.2s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>

    <!-- ── TOP BUN: intro drop-in ── -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 -14;0 1.2;0 0" keyTimes="0;0.75;1"
        dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.5 0 0.2 1;0.4 0 0.6 1"/>

      <!-- TOP BUN: periodic peek (lifts up, hovers, lands) -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="0 0;0 0;0 -2.5;0 -2.5;0 0.8;0 0"
          keyTimes="0;0.28;0.42;0.62;0.82;1"
          dur="5s" begin="2.5s" repeatCount="indefinite"
          calcMode="spline"
          keySplines="0 0 1 1;0.3 0 0.1 1;0 0 1 1;0.3 0 0.1 1;0.4 0 0.6 1"/>

        <!-- Bun fill -->
        <path d="M27.8,14C26.9,8.3,21.9,4,16,4S5.1,8.3,4.2,14H27.8z"
              fill="#E8900A" stroke="#92400E" stroke-width="1.2" stroke-linejoin="round"/>

        <!-- Sesame seed — centre: pops in, then sparkles in sync with peek -->
        <line x1="16" y1="8" x2="16" y2="10" stroke="#7C2D12" stroke-width="0" stroke-linecap="round">
          <animate attributeName="stroke-width" values="0;3;2"
            dur="0.22s" begin="0.62s" fill="freeze"
            calcMode="spline" keySplines="0.2 0 0.3 1;0.4 0 0.6 1"/>
          <animate attributeName="stroke-width"
            values="2;2;3;3;2;2"
            keyTimes="0;0.28;0.42;0.62;0.75;1"
            dur="5s" begin="2.5s" repeatCount="indefinite"/>
        </line>

        <!-- Sesame seed — left -->
        <line x1="11" y1="9" x2="11" y2="11" stroke="#7C2D12" stroke-width="0" stroke-linecap="round">
          <animate attributeName="stroke-width" values="0;3;2"
            dur="0.22s" begin="0.76s" fill="freeze"
            calcMode="spline" keySplines="0.2 0 0.3 1;0.4 0 0.6 1"/>
          <animate attributeName="stroke-width"
            values="2;2;3;3;2;2"
            keyTimes="0;0.28;0.42;0.62;0.75;1"
            dur="5s" begin="2.5s" repeatCount="indefinite"/>
        </line>

        <!-- Sesame seed — right -->
        <line x1="21" y1="9" x2="21" y2="11" stroke="#7C2D12" stroke-width="0" stroke-linecap="round">
          <animate attributeName="stroke-width" values="0;3;2"
            dur="0.22s" begin="0.90s" fill="freeze"
            calcMode="spline" keySplines="0.2 0 0.3 1;0.4 0 0.6 1"/>
          <animate attributeName="stroke-width"
            values="2;2;3;3;2;2"
            keyTimes="0;0.28;0.42;0.62;0.75;1"
            dur="5s" begin="2.5s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>

    <!-- ── PATTY + LETTUCE: fade in ── -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.3s" fill="freeze"/>

      <!-- Patty -->
      <rect x="3" y="14" width="26" height="3" fill="#6B2D07" rx="0.5"/>

      <!-- Lettuce wave: brightens when bun lifts, breathes with the float -->
      <path d="M4,16l1.5,1c0.9,0.6,2.1,0.6,3,0c0.9-0.6,2.1-0.6,3,0
               c0.9,0.6,2.1,0.6,3,0c0.9-0.6,2.1-0.6,3,0
               c0.9,0.6,2.1,0.6,3,0c0.9-0.6,2.1-0.6,3,0
               c0.9,0.6,2.1,0.6,3,0l1.5-1"
            fill="none" stroke="#15803D" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
        <!-- Bright green during peek, normal otherwise -->
        <animate attributeName="stroke"
          values="#15803D;#15803D;#22C55E;#22C55E;#15803D;#15803D"
          keyTimes="0;0.28;0.42;0.62;0.75;1"
          dur="5s" begin="2.5s" repeatCount="indefinite"/>
        <!-- Gentle stroke-width breath in sync with float -->
        <animate attributeName="stroke-width"
          values="2.2;2.6;2.2" dur="1.8s" begin="1.2s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
      </path>
    </g>

    <!-- ── BOTTOM BUN: intro rise-up ── -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 14;0 -1.2;0 0" keyTimes="0;0.75;1"
        dur="0.7s" fill="freeze"
        calcMode="spline" keySplines="0.5 0 0.2 1;0.4 0 0.6 1"/>

      <!-- Bottom bun band -->
      <path d="M27,24H5c-1.1,0-2-0.9-2-2v0c0-1.1,0.9-2,2-2h22c1.1,0,2,0.9,2,2v0C29,23.1,28.1,24,27,24z"
            fill="#E8900A" stroke="#92400E" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- Bottom bun base -->
      <path d="M27,24v1.4c0,1.5-1.2,2.6-2.6,2.6H7.6C6.2,28,5,26.8,5,25.4V24"
            fill="#CF7A08" stroke="#92400E" stroke-width="1.2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  </g>
  <!-- ===================== END FLOAT WRAPPER ===================== -->

</svg>
